<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoyo Tigre Abelardo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:black;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .container{
            position:relative;
            width:100%;
            max-width:500px;
        }

        /* Imagen */
        .fondo{
            width:100%;
            display:block;
            border-radius:12px;
        }

        /* Campo nombre */
        .nombre-box{
            position:absolute;
            top:25%;
            left:50%;
            transform:translateX(-50%);
            width:50%;
            text-align:center;
            z-index:10;
        }

        .nombre-box input{
            width:100%;
            border:none;
            outline:none;
            background:transparent;
            color:white;
            font-size:30px;
            font-weight:900;
            text-align:center;
            text-transform:uppercase;
            letter-spacing:1px;
            border-bottom:2px solid rgba(255,255,255,0.4);
            padding:5px;
        }

        .nombre-box input::placeholder{
            color:rgba(255,255,255,0.75);
        }

        /* Botón ícono descarga */
        .guardar-btn{
            position:absolute;
            top:20px;
            right:20px;
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:#fcd116;
            color:black;
            font-size:28px;
            font-weight:bold;
            cursor:pointer;
            z-index:10;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 4px 10px rgba(0,0,0,0.4);
            transition:0.2s;
        }

        .guardar-btn:hover{
            transform:scale(1.08);
        }

        /* RESPONSIVE CELULAR */
        @media(max-width:600px){
            .container{
                max-width:100%;
            }

            .nombre-box{
                top:25%;
                width:60%;
            }

            .nombre-box input{
                font-size:20px;
            }

            .guardar-btn{
                width:42px;
                height:42px;
                font-size:22px;
                top:15px;
                right:15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="imagen.jpg" class="fondo" id="imagen">

    <div class="nombre-box">
        <input 
            type="text" 
            id="nombre" 
            placeholder="NOMBRE"
            maxlength="20"
        >
    </div>

    <!-- Icono descarga -->
    <button id="guardarBtn" class="guardar-btn">⤓</button>
</div>

<script>
const nombreInput = document.getElementById("nombre");
const guardarBtn = document.getElementById("guardarBtn");
const imagen = document.getElementById("imagen");

/* Enter */
nombreInput.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        guardarImagen();
    }
});

/* Click */
guardarBtn.addEventListener("click", guardarImagen);

function guardarImagen(){

    let nombre = nombreInput.value.trim();

    if(nombre === ""){
        alert("Escribe tu nombre");
        return;
    }

    nombre = nombre.toUpperCase();
    nombreInput.value = nombre;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = imagen.naturalWidth;
    canvas.height = imagen.naturalHeight;

    // Dibujar imagen
    ctx.drawImage(imagen, 0, 0);

    // Configuración texto
    ctx.fillStyle = "white";
    ctx.font = "900 60px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Posición exacta del nombre
    const x = canvas.width / 2;
    const y = canvas.height * 0.31;

    ctx.fillText(nombre, x, y);

    // Descargar
    const link = document.createElement("a");
    link.download = nombre + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();

    // limpiar
    nombreInput.value = "";
}

/* Esperar que cargue imagen */
imagen.onload = () => {
    console.log("Imagen lista");
};
</script>

</body>
</html>
